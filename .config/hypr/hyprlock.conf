# ────────────────────────────────────────────────────────────
#  Hyprlock — aesthetic layout with side clock
# ────────────────────────────────────────────────────────────

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# ─── TIME (large, left side) ─────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(205, 214, 244, 1.0)
    font_size = 160
    font_family = CaskaydiaMono Nerd Font Bold
    position = -600, 180
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(137, 180, 250, 0.9)
    font_size = 160
    font_family = CaskaydiaMono Nerd Font Bold
    position = -600, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ─── DATE ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A")"
    color = rgba(205, 214, 244, 0.9)
    font_size = 28
    font_family = CaskaydiaMono Nerd Font
    position = -600, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%B %d, %Y")"
    color = rgba(205, 214, 244, 0.6)
    font_size = 18
    font_family = CaskaydiaMono Nerd Font
    position = -600, -220
    halign = center
    valign = center
}

# ─── DECORATIVE LINE ─────────────────────────────────────────
label {
    monitor =
    text = │
    color = rgba(137, 180, 250, 0.4)
    font_size = 400
    font_family = CaskaydiaMono Nerd Font
    position = -300, 0
    halign = center
    valign = center
}

# ─── GREETING ────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "Hey, $(whoami)"
    color = rgba(205, 214, 244, 0.8)
    font_size = 24
    font_family = CaskaydiaMono Nerd Font
    position = 200, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter password to unlock
    color = rgba(205, 214, 244, 0.4)
    font_size = 14
    font_family = CaskaydiaMono Nerd Font
    position = 200, 80
    halign = center
    valign = center
}

# ─── INPUT FIELD ─────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 55
    position = 200, 0
    halign = center
    valign = center

    inner_color = rgba(26, 27, 38, 0.6)
    outer_color = rgba(137, 180, 250, 0.8)
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    outline_thickness = 3

    font_family = CaskaydiaMono Nerd Font
    font_size = 18
    font_color = rgba(205, 214, 244, 1.0)

    placeholder_text =
    placeholder_color = rgba(205, 214, 244, 0.4)
    fail_text = <i>incorrect</i>
    fail_transition = 300

    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    rounding = 12
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
    fade_on_empty = false
    fade_timeout = 2000
}

# ─── LOCK ICON ───────────────────────────────────────────────
label {
    monitor =
    text =
    color = rgba(137, 180, 250, 0.6)
    font_size = 22
    font_family = CaskaydiaMono Nerd Font
    position = 200, -60
    halign = center
    valign = center
}
