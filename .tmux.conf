############################################
# TMUX Configuration - Dark Theme
############################################

# Unbind default prefix and set to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Address vim mode switching delay
set -s escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

############################################
# Key Bindings
############################################

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resizing with Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better split bindings (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Quick window switching
bind -n M-h previous-window
bind -n M-l next-window

# Swap windows
bind -r "<" swap-window -t -1
bind -r ">" swap-window -t +1

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Synchronize panes toggle
bind S setw synchronize-panes

# Clear scrollback history
bind C-k send-keys -R \; clear-history

# Break/Join panes
bind b break-pane -d
bind C choose-window 'join-pane -h -s "%%"'

# Popup window for quick terminal
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Quick session switcher (requires fzf)
bind s display-popup -E -w 80% -h 60% "tmux list-sessions -F '#S' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse --preview 'tmux list-windows -t {} -F \"#{window_index}: #{window_name} (#{pane_current_command})\"' --preview-window=right:50% | xargs -r tmux switch-client -t"

# Quick window switcher with pane preview (requires fzf)
bind w display-popup -E -w 80% -h 70% "tmux list-windows -F '#{window_index}:#{window_name} (#{pane_current_command})' | fzf --reverse --delimiter=':' --preview 'tmux capture-pane -t :{1} -p -e' --preview-window=right:60% | cut -d: -f1 | xargs -I{} tmux select-window -t :{}"

############################################
# Copy Mode (Vi-style)
############################################

setw -g mode-keys vi

# Copy mode bindings
bind [ copy-mode
bind ] paste-buffer

# Vi-style selection and copy (Wayland)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Paste from Wayland clipboard
bind ] run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"

############################################
# Terminal & Colors
############################################

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Default shell
set-option -g default-shell /bin/zsh

############################################
# Status Bar - Refined Minimal Theme
############################################

# Status bar position
set-option -g status-position bottom
set-option -g status on
set -g status-interval 1

# Status bar lengths
set -g status-left-length 60
set -g status-right-length 120

# Color palette
# bg:        #0d1017 (deep dark)
# surface:   #131720 (elevated surface)
# muted:     #3d4455 (muted text)
# text:      #9099a8 (secondary text)
# fg:        #c5cdd9 (primary text)
# accent:    #7aa2f7 (blue accent)
# accent2:   #9d7cd8 (purple accent)
# success:   #73daca (teal)
# warning:   #e0af68 (amber)
# urgent:    #f7768e (coral)

set -g status-style "bg=#0d1017,fg=#9099a8"

# Left side: Session indicator with prefix indicator prepended
set -g status-left "#{?client_prefix,#[fg=#0d1017 bg=#f7768e bold] 󰘳 #[default] ,}#[fg=#0d1017,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#131720]#[fg=#3d4455,bg=#131720]  #[fg=#131720,bg=#0d1017]"

# Right side: Subtle indicators + info
# Modes shown as minimal pills, time/date refined
set -g status-right "\
#{?client_prefix,#[fg=#f7768e,bg=#0d1017]#[fg=#0d1017,bg=#f7768e,bold] 󰘳 #[fg=#f7768e,bg=#0d1017] ,}\
#{?pane_synchronized,#[fg=#e0af68,bg=#0d1017]#[fg=#0d1017,bg=#e0af68,bold] 󰓦 #[fg=#e0af68,bg=#0d1017] ,}\
#{?window_zoomed_flag,#[fg=#73daca,bg=#0d1017]#[fg=#0d1017,bg=#73daca,bold] 󰊓 #[fg=#73daca,bg=#0d1017] ,}\
#[fg=#131720,bg=#0d1017]#[fg=#3d4455,bg=#131720]  #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '~') \
#[fg=#9099a8]󰃭 %b %d #[fg=#c5cdd9,bold]%H:%M \
#[fg=#9d7cd8,bg=#131720]#[fg=#0d1017,bg=#9d7cd8,bold] 󰒋 #h #[default]"

# Window status: Clean pill style with subtle active indicator
set -g window-status-format "#[fg=#3d4455,bg=#0d1017]  #I #[fg=#565f89]#W "
set -g window-status-current-format "#[fg=#131720,bg=#0d1017]#[fg=#7aa2f7,bg=#131720,bold]  #I #[fg=#c5cdd9]#W #[fg=#131720,bg=#0d1017]"

# Window separator
set -g window-status-separator ""

# Window status styles
set-window-option -g window-status-current-style "fg=#c5cdd9,bg=#131720"
set-window-option -g window-status-style "fg=#565f89,bg=#0d1017"
set-window-option -g window-status-activity-style "fg=#e0af68,bg=#0d1017,none"
set-window-option -g window-status-bell-style "fg=#f7768e,bg=#0d1017,bold"

# Messages: Clean and visible
set-option -g message-style "bg=#131720,fg=#c5cdd9"
set-option -g message-command-style "bg=#131720,fg=#7aa2f7"

# Copy mode
setw -g mode-style "bg=#1f2335,fg=#c5cdd9"

############################################
# Pane Borders - Minimal & Clean
############################################

# Subtle single-line borders
set -g pane-border-style "fg=#1f2335"
set -g pane-active-border-style "fg=#7aa2f7"

# Clean single line borders (tmux 3.2+)
set -g pane-border-lines single

# Pane indicators with border status
set -g pane-border-status off
set -g pane-border-format "#[fg=#3d4455] #{pane_index}  #{pane_current_command} "

# Pane number display
set -g display-panes-colour "#3d4455"
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-time 1500

############################################
# Additional Settings
############################################

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Clock mode
setw -g clock-mode-colour "#9d7cd8"
setw -g clock-mode-style 24

# Automatic rename
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"

############################################
# Plugins
############################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

