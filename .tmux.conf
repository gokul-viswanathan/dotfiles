############################################
# TMUX Configuration - Dark Theme
############################################

# Unbind default prefix and set to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Address vim mode switching delay
set -s escape-time 0

# Focus events enabled for terminals that support them
set -g focus-events on

############################################
# Key Bindings
############################################

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resizing with Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better split bindings (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Quick window switching
bind -n M-h previous-window
bind -n M-l next-window

############################################
# Copy Mode (Vi-style)
############################################

setw -g mode-keys vi

# Copy mode bindings
bind [ copy-mode
bind ] paste-buffer

# Vi-style selection and copy (Wayland)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Paste from Wayland clipboard
bind ] run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"

############################################
# Terminal & Colors
############################################

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Default shell
set-option -g default-shell /bin/zsh

############################################
# Status Bar - Modern Dark Theme
############################################

# Status bar position
set-option -g status-position bottom
set-option -g status on
set -g status-interval 2

# Status bar lengths
set -g status-left-length 50
set -g status-right-length 100

# Color scheme - Deep dark with purple/blue accents
set -g status-style "bg=#0f111a,fg=#a9b1d6"

# Left side: Session name with icon
set -g status-left "#[fg=#bb9af7,bg=#1a1b26,bold] 󰊠 #S #[fg=#1a1b26,bg=#0f111a]"

# Right side: Date & time with icons
set -g status-right "#[fg=#1a1b26,bg=#0f111a]#[fg=#7aa2f7,bg=#1a1b26] 󰃭 %Y-%m-%d #[fg=#bb9af7]󰥔 %H:%M #[fg=#2a2b3d,bg=#1a1b26]#[fg=#9ece6a,bg=#2a2b3d,bold] #h "

# Window status format
set -g window-status-format "#[fg=#565f89,bg=#0f111a] #I:#W "
set -g window-status-current-format "#[fg=#0f111a,bg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W #[fg=#7aa2f7,bg=#0f111a]"

# Window separator
set -g window-status-separator ""

# Active window
set-window-option -g window-status-current-style "fg=#1a1b26,bg=#7aa2f7,bold"

# Inactive windows
set-window-option -g window-status-style "fg=#565f89,bg=#0f111a"

# Messages
set-option -g message-style "bg=#1a1b26,fg=#bb9af7,bold"

# Command line
set-option -g message-command-style "bg=#1a1b26,fg=#7aa2f7"

# Copy mode
setw -g mode-style "bg=#2a2b3d,fg=#c0caf5"

############################################
# Pane Borders
############################################

# Pane borders
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7"

# Pane number display
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"

############################################
# Additional Settings
############################################

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Clock mode
setw -g clock-mode-colour "#7aa2f7"
setw -g clock-mode-style 24

# Automatic rename
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S / #W"

############################################
# Plugins
############################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

