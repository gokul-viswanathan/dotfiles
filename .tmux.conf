unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#to copy 
# Enable vi mode for copy mode
setw -g mode-keys vi

# Copy mode bindings for Wayland
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Enter copy mode with Prefix + [
bind [ copy-mode

# Mouse selection should copy to clipboard (Wayland)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Optional: Add a paste binding using wl-paste
bind ] run "wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer"


#####status bar settings#####

# Status bar
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Active window
set-window-option -g window-status-current-style "fg=#7aa2f7,bg=#24283b,bold"

# Inactive windows
set-window-option -g window-status-style "fg=#565f89,bg=#1a1b26"

# Messages
set-option -g message-style "bg=#24283b,fg=#bb9af7"

# Copy-mode
setw -g mode-style "bg=#24283b,fg=#7aa2f7"

# Selection highlight in copy-mode
setw -g mode-style "bg=#414868,fg=#c0caf5"

# Intervals & length
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 100

# Status content
set -g status-left "#[fg=#7aa2f7]#S #[fg=#565f89]|"
set -g status-right "#[fg=#565f89]| #[fg=#7aa2f7]%Y-%m-%d %H:%M #[fg=#bb9af7]%a"

set-option -g status-position bottom
set-option -g status on 

